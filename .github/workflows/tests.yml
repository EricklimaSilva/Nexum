name: Nexum CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: test-secret-key-unsafe-only-for-tests
      FLASK_ENV: testing

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexum_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nexum_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run normal test suite (SQLite safety)
        run: |
          pytest -v

      - name: Run coverage
        run: |
          pytest --cov=app --cov-report=term-missing

      - name: Run compile check
        run: |
          python -m compileall app tests

      - name: Upgrade migrations on PostgreSQL test database
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nexum_test
        run: |
          flask db upgrade

      - name: Run PostgreSQL integration suite
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nexum_test
        run: |
          pytest -m postgres -v
