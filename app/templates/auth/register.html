{% extends 'base.html' %}

{% block title %}Registrar{% endblock %}

{% block content %}
  <div class="auth-layout">
    <div class="card auth-box">
      <h2>Registrar</h2>
      <p class="muted">Crie seu perfil e comece sua progressão.</p>

      <form method="post">
        <label>
          Nome
          <input type="text" name="name" required>
        </label>

        <label>
          E-mail
          <input type="email" name="email" required>
        </label>

        <label>
          Senha
          <input type="password" name="password" required>
        </label>

        <button class="button" type="submit">Criar conta</button>
      </form>

      <p class="muted">Já possui conta? <a href="{{ url_for('auth.login') }}">Faça login</a>.</p>
    </div>
  </div>
{% endblock %}
