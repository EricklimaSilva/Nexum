{% extends 'base.html' %}

{% block title %}Erro interno{% endblock %}

{% block content %}
  <div class="error-page">
    <div class="card error-card">
      <p class="eyebrow">Servidor</p>
      <h1 class="error-code">500</h1>
      <p class="muted">Ocorreu um erro interno. Tente novamente em instantes.</p>
      <div class="mt-2">
        <a class="button-secondary" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">Voltar</a>
      </div>
    </div>
  </div>
{% endblock %}
