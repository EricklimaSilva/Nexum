{% extends 'base.html' %}

{% block title %}Acesso restrito{% endblock %}

{% block content %}
  <div class="error-page">
    <div class="card error-card">
      <p class="eyebrow">Acesso restrito</p>
      <h1 class="error-code">403</h1>
      <p class="muted">
        {% if reason %}
          {{ reason }}
        {% else %}
          Você não tem permissão para acessar esta parte do Nexum.
        {% endif %}
      </p>
      <div class="mt-2">
        <a class="button-secondary" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">Voltar</a>
      </div>
    </div>
  </div>
{% endblock %}
