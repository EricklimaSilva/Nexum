<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nexum{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nexum.css') }}">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap" aria-label="Nexum home">
        <div class="brand-mark">N</div>
        <div class="brand-text">NEXUM</div>
      </div>

      <nav class="nav-links" aria-label="Navegação principal">
        {% if current_user.is_authenticated %}
          <a class="nav-link{% if request.endpoint == 'dashboard.index' %} active{% endif %}" href="{{ url_for('dashboard.index') }}">Dashboard</a>
          <a class="nav-link{% if request.endpoint == 'quick_log.index' %} active{% endif %}" href="{{ url_for('quick_log.index') }}">Quick Log</a>
          <a class="nav-link{% if request.endpoint == 'goals.index' %} active{% endif %}" href="{{ url_for('goals.index') }}">Goals</a>
          <a class="nav-link{% if request.endpoint == 'finance.index' %} active{% endif %}" href="{{ url_for('finance.index') }}">Finance</a>
          <a class="nav-link{% if request.endpoint == 'body.index' %} active{% endif %}" href="{{ url_for('body.index') }}">Body</a>
          <a class="nav-link{% if request.endpoint == 'workouts.index' %} active{% endif %}" href="{{ url_for('workouts.index') }}">Workouts</a>
          <a class="nav-link nav-link--danger" href="{{ url_for('auth.logout') }}">Logout</a>
        {% else %}
          <a class="nav-link" href="{{ url_for('auth.login') }}">Entrar</a>
          <a class="nav-link" href="{{ url_for('auth.register') }}">Registrar</a>
        {% endif %}
      </nav>
    </header>

    <main class="container">
      {% include 'includes/flash_messages.html' %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
